  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18393228592"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'AW-18393228592');
  </script>

  <!--
    Google Ads conversion snippets.

    Google hands out the same function name (gtag_report_conversion) for every
    conversion action, so pasting two verbatim would leave the second silently
    overwriting the first. They are named per conversion here instead.
  -->

  <!-- Event snippet for WhatsApp Enquiry conversion -->
  <script>
    function gtag_report_whatsapp_conversion(url) {
      var callback = function () {
        if (typeof(url) != 'undefined') {
          window.location = url;
        }
      };
      gtag('event', 'conversion', {
          'send_to': 'AW-18393228592/0XSFCN-g6eQcELDKycJE',
          'value': 1.0,
          'currency': 'INR',
          'event_callback': callback
      });
      return false;
    }
  </script>

  <!-- Event snippet for Website Phone Call conversion -->
  <script>
    function gtag_report_call_conversion(url) {
      var callback = function () {
        if (typeof(url) != 'undefined') {
          window.location = url;
        }
      };
      gtag('event', 'conversion', {
          'send_to': 'AW-18393228592/-_HqCNC97-QcELDKycJE',
          'event_callback': callback
      });
      return false;
    }
  </script>
