<div class="admin-shell">
  <mat-toolbar class="admin-toolbar" color="primary">
    <div class="toolbar-brand">
      <mat-icon class="brand-icon">terrain</mat-icon>
      <span class="brand-name">Kumaon Yatra Tours</span>
      <span class="brand-tag">Admin</span>
    </div>

    <div class="toolbar-nav">
      <!-- Admin dropdown: Dashboard + Gallery -->
      <button mat-button [matMenuTriggerFor]="adminMenu"
              [class.nav-active]="dashboardLink.isActive || galleryLink.isActive">
        <mat-icon>admin_panel_settings</mat-icon>
        Admin
        <mat-icon class="caret">arrow_drop_down</mat-icon>
      </button>

      <mat-menu #adminMenu="matMenu">
        <a mat-menu-item routerLink="/admin/dashboard">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>
        <a mat-menu-item routerLink="/admin/gallery">
          <mat-icon>photo_library</mat-icon>
          <span>Gallery</span>
        </a>
      </mat-menu>

      <a mat-button routerLink="/admin/packages/new" routerLinkActive="nav-active">
        <mat-icon>add_circle</mat-icon> Add Package
      </a>

      <!-- Hidden probes so the Admin button can show an active state for
           either of its child routes. -->
      <span hidden routerLink="/admin/dashboard" routerLinkActive
            #dashboardLink="routerLinkActive"></span>
      <span hidden routerLink="/admin/gallery" routerLinkActive
            #galleryLink="routerLinkActive"></span>
    </div>

    <div class="toolbar-user">
      <span class="user-email">{{ auth.userEmail }}</span>
      <button mat-icon-button (click)="logout()" matTooltip="Sign Out">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
