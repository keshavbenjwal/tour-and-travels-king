<nav class="navbar" [class.scrolled]="isScrolled() || !isHomePage()" [class.menu-open]="mobileMenuOpen()">
  <div class="container nav-inner">

    <a routerLink="/" class="nav-logo" (click)="closeMenu()">
      <div class="logo-icon">
        <img src="logo.png" alt="Kumaon Yatra Tours logo" width="56" height="56">
      </div>
      <div class="logo-text">
        <span class="logo-title">Kumaon Yatra Tours</span>
        <span class="logo-tagline">Sacred Himalayas</span>
      </div>
    </a>

    <ul class="nav-links" [class.open]="mobileMenuOpen()">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            (click)="closeMenu()"
          >{{ link.label }}</a>
        </li>
      }
      <li class="nav-cta">
        <a routerLink="/contact" class="btn btn-primary btn-sm" (click)="closeMenu()">
          <i class="fas fa-paper-plane"></i> Enquire Now
        </a>
      </li>
    </ul>

    <button class="hamburger" (click)="toggleMenu()" [attr.aria-expanded]="mobileMenuOpen()" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</nav>
